{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <section class="card shell-card p-4 p-md-5">
            <h1 class="h3 mb-3 text-warning">Login</h1>
            <p class="text-secondary mb-4">Sign in to continue to your rides.</p>
            <form method="post" class="vstack gap-3">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-warning fw-semibold">Sign in</button>
            </form>
            <p class="mt-3 mb-0 small text-secondary">
                New here?
                <a href="{% url 'rides:signup' %}" class="link-warning">Create an account</a>
            </p>
        </section>
    </div>
</div>
{% endblock %}
